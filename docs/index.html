<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SeenToast Demo</title>


  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px;
      font-family: Inter, sans-serif;
      background: #0f172a;
      color: white;
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
    }

    .wrapper {
      max-width: 1200px;
      margin: 0 auto;
    }

    .grid {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 32px;
      margin-top: 32px;
    }

    .panel {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 24px;
    }

    .panel h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 1rem;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      opacity: 0.8;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.06);
      color: white;
      outline: none;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .field {
      flex: 1;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .checkbox input {
      width: auto;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 12px;
      padding: 14px 18px;
      font-weight: 600;
      width: 100%;
      background: white;
      color: black;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .preview {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .help {
      opacity: 0.7;
      font-size: 14px;
      line-height: 1.6;
    }

    code {
      background: rgba(255,255,255,0.08);
      padding: 2px 6px;
      border-radius: 6px;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="wrapper">

  <h1>SeenToast Playground</h1>

  <div class="help">
    Customize and preview toast notifications in real time.
  </div>

  <div class="grid">

    <div class="panel">

      <h2>Toast Options</h2>

      <div class="field">
        <label>Title</label>
        <input type="text" id="title" placeholder="Notification title" />
      </div>

      <div class="field">
        <label>Message</label>
        <textarea id="message">This is a SeenToast notification.</textarea>
      </div>

      <div class="row">
        <div class="field">
          <label>Type</label>

          <select id="type">
            <option value="success">success</option>
            <option value="error">error</option>
            <option value="warning">warning</option>
            <option value="info">info</option>
          </select>
        </div>

        <div class="field">
          <label>Theme</label>

          <select id="theme">
            <option value="light">light</option>
            <option value="dark" selected>dark</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Position</label>

          <select id="position">
            <option value="top-left">top-left</option>
            <option value="top-center">top-center</option>
            <option value="top-right">top-right</option>
            <option value="bottom-left">bottom-left</option>
            <option value="bottom-center" selected>bottom-center</option>
            <option value="bottom-right">bottom-right</option>
          </select>
        </div>

        <div class="field">
          <label>Duration (ms)</label>
          <input type="number" id="duration" value="4000" />
        </div>
      </div>

      <div class="checkbox">
        <input type="checkbox" id="closable" checked />
        <label for="closable">Closable</label>
      </div>

      <div class="checkbox">
        <input type="checkbox" id="pauseOnHover" checked />
        <label for="pauseOnHover">Pause on hover</label>
      </div>

      <div class="checkbox">
        <input type="checkbox" id="showIcon" checked />
        <label for="showIcon">Show icon</label>
      </div>

      <div class="checkbox">
        <input type="checkbox" id="actions" />
        <label for="actions">Add action buttons</label>
      </div>

      <button id="showToast">
        Show Toast
      </button>

    </div>

    <div class="panel preview">

      <h2>Usage Example</h2>

      <pre><code id="codePreview"></code></pre>

      <div class="help">
        Progress bar is automatically hidden for durations below <code>2000ms</code>.
      </div>

    </div>

  </div>

</div>

<script type="module">
  import Seen, { initSeen } from "./src/index.ts";

  initSeen();

  const codePreview = document.getElementById("codePreview");

  function getOptions() {
    const withActions = document.getElementById("actions").checked;

    return {
      title: document.getElementById("title").value,
      message: document.getElementById("message").value,
      type: document.getElementById("type").value,
      theme: document.getElementById("theme").value,
      position: document.getElementById("position").value,
      duration: Number(document.getElementById("duration").value),
      closable: document.getElementById("closable").checked,
      pauseOnHover: document.getElementById("pauseOnHover").checked,
      showIcon: document.getElementById("showIcon").checked,

      actions: withActions
        ? [
            {
              label: "Cancel",
              onClick: () => console.log("cancel")
            },
            {
              label: "Confirm",
              onClick: () => console.log("confirm")
            }
          ]
        : []
    };
  }

  function updateCodePreview() {
    const options = getOptions();

    codePreview.textContent =
`Seen.toast(${JSON.stringify(options, null, 2)});`;
  }

  [
    "title",
    "message",
    "type",
    "theme",
    "position",
    "duration",
    "closable",
    "pauseOnHover",
    "showIcon",
    "actions"
  ].forEach(id => {
    document.getElementById(id).addEventListener("input", updateCodePreview);
    document.getElementById(id).addEventListener("change", updateCodePreview);
  });

  updateCodePreview();

  document.getElementById("showToast").addEventListener("click", () => {
    Seen.toast(getOptions());
  });
</script>

</body>
</html>
